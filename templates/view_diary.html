<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>查看日記</title>
</head>
<body>
    <h2>日記內容</h2>
    <p><strong>作者：</strong>{{ diary.user }}</p>
    <p>{{ diary.content }}</p>
    {% if diary.image %}
        <img src="{{ url_for('static', filename='uploads/' + diary.image) }}" alt="圖片" width="200">
    {% endif %}

    <h4>留言：</h4>
    <ul>
        {% for c in diary.comments %}
            <li><strong>{{ c.user }}：</strong> {{ c.text }}</li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('public_diary') }}">← 返回公開日記</a>
</body>
</html>
