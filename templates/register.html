{% extends "base.html" %}

{% block content %}
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to bottom, #eef5ff, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-container {
        background-color: #ffffff;
        padding: 2rem 3rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }

    .login-container h2 {
        margin-bottom: 1.5rem;
        color: #2c65d9;
        font-weight: bold;
        font-size: 1.8rem;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        margin: 0.5rem 0;
        border: 1px solid #bcdcff;
        border-radius: 8px;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.3s;
    }

    .login-container input:focus {
        border-color: #6caeff;
        outline: none;
    }

    .login-container button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.75rem;
        background-color: #6caeff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .login-container button:hover {
        background-color: #5a9ae6;
    }

    .login-container p {
        margin-top: 1rem;
        font-size: 0.9rem;
        color: #666;
    }

    .login-container a {
        color: #2c65d9;
        text-decoration: none;
    }

    .login-container a:hover {
        text-decoration: underline;
    }
</style>
<div class="login-container">
    <h2>註冊帳號</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="使用者名稱" required><br>
        <input type="password" name="password" placeholder="密碼" required><br>
        <button type="submit">註冊</button>
    </form>

    {% if msg %}
        <script>alert("{{ msg }}");</script>
    {% endif %}

    <p>已有帳號？<a href="{{ url_for('login') }}">點我登入</a></p>
</div>
{% endblock %}
