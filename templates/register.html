{% extends "base.html" %}
{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #f0f4f8, #e8f0fa);
    font-family: 'Helvetica Neue', 'Segoe UI', sans-serif;
    color: #2e3a59;
    margin: 0;
    padding: 0;
  }

  form {
    max-width: 400px;
    margin: 80px auto;
    padding: 32px;
    background: #ffffff;
    border: 1px solid #d6e4f0;
    border-radius: 12px;
  }

  h2 {
    text-align: center;
    color: #3c78d8;
    font-size: 24px;
    margin-bottom: 24px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid #bdd7ee;
    border-radius: 8px;
    font-size: 16px;
    background-color: #f9fbfd;
    transition: border-color 0.2s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #84b9f5;
    outline: none;
    background-color: #ffffff;
  }

  button {
    width: 100%;
    padding: 14px;
    background-color: #6baefc;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #589ff0;
  }

  p {
    text-align: center;
    font-size: 14px;
    color: #5f6c7b;
    margin-top: 24px;
  }

  p a {
    color: #5c9ff0;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
  }

  p a:hover {
    color: #3a84e5;
    text-decoration: underline;
  }
</style>

<h2>註冊帳號</h2>
<form method="POST">
  <input type="text" name="username" placeholder="使用者名稱" required><br>
  <input type="password" name="password" placeholder="密碼" required><br>
  <button type="submit">註冊</button>
</form>

{% if msg %}
<script>alert("{{ msg }}");</script>
{% endif %}

<p>已有帳號？<a href="{{ url_for('login') }}">點我登入</a></p>
{% endblock %}
