{% extends "base.html" %}
{% block content %}
<h2>我的日記</h2>

<form method="POST" enctype="multipart/form-data">
    <textarea name="content" placeholder="今天的心情..." rows="5" cols="40" required></textarea><br>
    <input type="file" name="image"><br>
    <button type="submit">儲存日記</button>
</form>

<hr>
{% for entry in entries %}
    <p><strong>{{ entry.timestamp.strftime('%Y-%m-%d %H:%M') }}</strong></p>
    <p>{{ entry.content }}</p>
    {% if entry.image_filename %}
        <img src="{{ url_for('static', filename='uploads/' + entry.image_filename) }}" width="300"><br>
    {% endif %}
    <hr>
{% endfor %}
<a href="{{ url_for('logout') }}">登出</a>
{% endblock %}
