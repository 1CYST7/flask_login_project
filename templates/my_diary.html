<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的日記</title>
</head>
<body>
    <h1>我的日記</h1>
    <a href="/write">➕ 新增日記</a> | 
    <a href="/public_diary">查看大家的公開日記</a> |
    <a href="/notifications">通知中心</a> |
    <a href="/logout">登出</a>
    <hr>
    {% if diaries %}
        {% for d in diaries %}
            <div style="margin-bottom: 20px;">
                
                <p> <small>{{ "🌍" if d.is_public else "🔒" }}</small> {{ d.content }}</p>
                {% if d.image %}
                    <img src="{{ url_for('static', filename='uploads/' + d.image) }}" width="200"><br>
                {% endif %}
                
            </div>
            <hr>
            

        {% endfor %}
    {% else %}
        <p>目前尚無日記。</p>
    {% endif %}
</body>
</html>
