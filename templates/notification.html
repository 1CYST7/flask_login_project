<!-- templates/notification.html -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>通知中心</title>
</head>
<body>
    <h1>通知中心</h1>
    <a href="/write">回到發文</a> | <a href="/my_diary">我的日記</a> | <a href="/public_diary">公開日記</a> | <a href="/logout">登出</a>
    <hr>

    {% if notifications %}
        {% for n in notifications %}
            <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 15px;">
                <p><strong>{{ n.from_user }}</strong> {{ n.message }}</p>
                {% if n.diary_index is not none %}
                    <a href="{{ url_for('view_diary', index=n.diary_index) }}">查看原日記</a>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
        <p>目前沒有通知。</p>
    {% endif %}
</body>
</html>
