<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>公開日記</title>
</head>
<body>
    <h1>🌍 公開日記</h1>
    <a href="/my_diary">回到我的日記</a>
    <hr>
    {% if diaries %}
        {% for d in diaries %}
            <div style="margin-bottom: 20px;">
                <strong>{{ d.user }}</strong> 的日記：
                <p>{{ d.content }}</p>
                {% if d.image %}
                    <img src="{{ url_for('static',  filename='uploads/' + d.image) }}" alt="日記圖片" style="max-width: 300px; max-height: 300px;">
                {% endif %}
                <hr>
            </div>
        {% endfor %}
    {% else %}
        <p>目前尚無公開日記。</p>
    {% endif %}
</body>
</html>
